<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FATA University Hostel</title>
  <link rel="icon" href="assets/images/logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="assets/css/style.css?v=1.0.2" />
  <link rel="stylesheet" href="assets/css/login.css?v=1.0.2" />
</head>

<body>

  <!-- ====== SITE HEADER ====== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="header-brand">
        <img src="assets/images/logo.png" alt="Logo">
        <span>FATA University Hostel</span>
      </a>
      <nav class="header-nav">
        <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Home</a>
        <a href="register.html" class="btn-home"><i class="fas fa-user-plus"></i> Register</a>
      </nav>
    </div>
  </header>

  <!-- ====== MAIN ====== -->
  <main class="login-main">
    <div class="login-wrapper">

      <div class="login-card">
        <div class="login-logo">
          <img src="assets/images/logo.png" alt="Logo">
          <h3>FATA University Hostel</h3>
          <p>Sign in to your account</p>
        </div>
        <div id="loginAlert"></div>

        <div class="form-group">
          <label>Email / Username</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-control" id="loginEmail" placeholder="your@gmail.com or admin"
              autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password"
              autocomplete="current-password" />
            <button type="button" class="toggle-pwd" onclick="togglePwd('loginPassword',this)"><i
                class="fas fa-eye"></i></button>
          </div>
          <a href="forgot-password.html" class="forgot-link"><i class="fas fa-key"></i> Forgot Password?</a>
        </div>

        <button class="login-btn" id="loginBtn" onclick="doLogin()">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>

        <div class="divider"><span>Not registered yet?</span></div>

        <div class="register-options">
          <a href="register.html?type=student" class="register-btn student">
            <i class="fas fa-user-graduate"></i> Student Register
          </a>
          <a href="register.html?type=faculty" class="register-btn faculty">
            <i class="fas fa-chalkboard-teacher"></i> Faculty Register
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- ====== FOOTER ====== -->
  <footer class="site-footer">
    <p>&copy; 2026 FATA University Hostel &nbsp;|&nbsp; <a href="index.html">Home</a> &nbsp;|&nbsp; <a
        href="index.html#contact">Contact</a></p>
  </footer>

  <script>
    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.innerHTML = inp.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    }

    function showAlert(msg, type = 'danger') {
      document.getElementById('loginAlert').innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-triangle' : 'times-circle'}"></i> ${msg}</div>`;
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pw = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      if (!email || !pw) { showAlert('Please enter email and password.', 'warning'); return; }
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      const fd = new FormData();
      fd.append('action', 'login'); fd.append('email', email); fd.append('password', pw);
      try {
        const res = await fetch('api/auth.php', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.success) {
          showAlert('Login successful! Redirecting...', 'success');
          const intended = sessionStorage.getItem('intended_url');
          sessionStorage.removeItem('intended_url');
          setTimeout(() => { window.location.href = intended || data.redirect; }, 700);
        } else {
          showAlert(data.message || 'Invalid credentials.');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
      } catch {
        showAlert('Cannot connect to server. Make sure PHP is running.', 'warning');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      }
    }

    // Enter key support
    ['loginEmail', 'loginPassword'].forEach(id => {
      document.getElementById(id)?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    });

    // Store intended URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('redirect')) sessionStorage.setItem('intended_url', decodeURIComponent(params.get('redirect')));

    // Auto redirect if already logged in
    (async () => {
      try {
        const res = await fetch('api/auth.php?action=check_session');
        const d = await res.json();
        if (d.logged_in) {
          const m = { Admin: 'admin/dashboard.html', Student: 'student/dashboard.html', Faculty: 'faculty/dashboard.html' };
          window.location.href = m[d.user_role] || 'index.html';
        }
      } catch { }
    })();
  </script>
</body>

</html>
